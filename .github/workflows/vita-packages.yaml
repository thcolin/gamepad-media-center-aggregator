name: vita-packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08@sha256:d955f0101f61a13134df5f5a2445eb00328a674aef6613b028670eb12f7abc88
    env:
      DEPS_URL: https://github.com/thcolin/gamepad-media-center-aggregator/releases/download/ci-deps
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: scripts/vita
    - name: Build curl
      run: |
        # --nodeps: vita-makepkg looks for $VITASDK/bin/pacman, absent from this
        # image; mbedtls is installed below and zlib ships with vitasdk.
        vdpm pacman --noconfirm -U $DEPS_URL/mbedtls-3.6.7-1-vita.pkg.tar.xz
        chown -R vitasdk:vitasdk scripts/vita
        su -p vitasdk -s /bin/bash <<'EOF'
          export PATH=$VITASDK/bin:$PATH
          cd $GITHUB_WORKSPACE/scripts/vita/curl
          vita-makepkg -dCf --noconfirm
        EOF

    - name: Upload packages
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ci-deps
        prerelease: true
        make_latest: false
        overwrite_files: false
        files: scripts/vita/curl/*.pkg.tar.xz
